services:
  - type: web
    name: tambala-pay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_ACCESS_TOKEN
        sync: false
      - key: PAYCHANGU_SECRET_KEY
        sync: false
      - key: PAYCHANGU_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
