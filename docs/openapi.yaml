openapi: 3.0.3
info:
  title: Tambala Pay API
  version: 1.0.0
  description: |
    API contract for Tambala Pay's existing routes. Internal endpoints require
    the shared bearer token configured as INTERNAL_ACCESS_TOKEN. Keep that
    token in an organizational backend secret store; never expose it to browsers
    or AI agents. Public invoice endpoints are intended for invoice holders.
    Payment status is authoritative only after server-side PayChangu verification.
servers:
  - url: https://tambala-pay.onrender.com
    description: Render deployment
tags:
  - name: Health
  - name: Internal invoices
  - name: Internal payments
  - name: Public invoice and checkout
  - name: Provider callbacks
components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque token
      description: Value of INTERNAL_ACCESS_TOKEN. Server-to-server only.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    InvoiceInput:
      type: object
      required: [description, totalAmount]
      properties:
        description: { type: string, maxLength: 180, example: Website development }
        customerName: { type: string, maxLength: 100, example: Example Customer }
        customerEmail: { type: string, format: email, maxLength: 254 }
        totalAmount: { type: number, minimum: 1, maximum: 100000000, example: 150000 }
    PaymentInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number, minimum: 1, maximum: 100000000, example: 50000 }
    PublicPaymentInput:
      allOf:
        - $ref: '#/components/schemas/PaymentInput'
        - type: object
          required: [email]
          properties:
            email: { type: string, format: email }
    PaymentVerificationInput:
      type: object
      required: [tx_ref]
      properties:
        tx_ref: { type: string, maxLength: 80 }
    PaymentRequestInput:
      type: object
      required: [description, amount]
      properties:
        description: { type: string, maxLength: 180 }
        customerName: { type: string, maxLength: 100 }
        customerEmail: { type: string, format: email, maxLength: 254 }
        amount: { type: number, minimum: 1, maximum: 100000000 }
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check service health
      security: []
      responses:
        '200':
          description: Service is responding
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string, example: tambala-pay }
                  mode: { type: string }
  /api/invoices:
    get:
      tags: [Internal invoices]
      summary: List recent invoices
      security: [{ InternalBearer: [] }]
      responses:
        '200':
          description: Up to 250 invoices, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices: { type: array, items: { type: object, additionalProperties: true } }
        '401': { description: Missing or invalid internal token }
    post:
      tags: [Internal invoices]
      summary: Create an invoice
      security: [{ InternalBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '201': { description: Invoice created; returns invoice, paid_amount and balance_due }
        '400': { description: Invalid description, amount or email }
        '401': { description: Missing or invalid internal token }
  /api/invoices/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Internal invoices]
      summary: Get invoice and payment attempts
      security: [{ InternalBearer: [] }]
      responses:
        '200': { description: Invoice with payments array }
        '401': { description: Missing or invalid internal token }
        '404': { description: Invoice not found }
  /api/invoices/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Internal invoices]
      summary: Create an invoice payment and hosted checkout
      description: Creates a payment attempt against the available invoice balance. Pending attempts reserve their amount. Requires PayChangu credentials.
      security: [{ InternalBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201': { description: Payment created; returns payment details and checkout URL/QR data }
        '400': { description: Invalid amount or amount exceeds available balance }
        '401': { description: Missing or invalid internal token }
        '404': { description: Invoice not found }
        '409': { description: Invoice is cancelled or already paid }
        '502': { description: Checkout provider failed }
        '503': { description: PayChangu is not configured }
  /api/summary:
    get:
      tags: [Internal payments]
      summary: Get aggregate payment summary
      security: [{ InternalBearer: [] }]
      responses:
        '200':
          description: Aggregate counts and amounts in MWK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_requests: { type: integer }
                  successful_payments: { type: integer }
                  pending_payments: { type: integer }
                  failed_payments: { type: integer }
                  collected_mwk: { type: string }
                  pending_mwk: { type: string }
        '401': { description: Missing or invalid internal token }
  /api/requests:
    get:
      tags: [Internal payments]
      summary: List legacy payment requests
      security: [{ InternalBearer: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 250, default: 100 }
      responses:
        '200': { description: Returns requests array }
        '401': { description: Missing or invalid internal token }
    post:
      tags: [Internal payments]
      summary: Create a one-off payment request
      security: [{ InternalBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequestInput' }
      responses:
        '201': { description: Payment request created with checkout details }
        '400': { description: Invalid request fields }
        '401': { description: Missing or invalid internal token }
        '502': { description: Checkout provider failed }
        '503': { description: PayChangu is not configured }
  /api/requests/{id}/receipt:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Internal payments]
      summary: Get receipt for a one-off payment request
      security: [{ InternalBearer: [] }]
      responses:
        '200': { description: Receipt details }
        '401': { description: Missing or invalid internal token }
        '404': { description: Payment request not found }
        '409': { description: Receipt not available until payment is verified }
  /api/invoice-payments/{id}/receipt:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Internal payments]
      summary: Get receipt for an invoice payment
      security: [{ InternalBearer: [] }]
      responses:
        '200': { description: Receipt details }
        '401': { description: Missing or invalid internal token }
        '404': { description: Payment not found }
        '409': { description: Receipt not available until payment is verified }
  /invoice/{id}:
    get:
      tags: [Public invoice and checkout]
      summary: Serve customer invoice page
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: HTML invoice page }
  /api/public/invoices/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Public invoice and checkout]
      summary: Get public invoice details and successful payments
      security: []
      responses:
        '200': { description: Invoice, paid_amount, balance_due and confirmed payments }
        '404': { description: Invoice not found }
  /api/public/invoices/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Public invoice and checkout]
      summary: Start customer checkout for a partial payment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicPaymentInput' }
      responses:
        '201': { description: Payment record and PayChangu inline checkout configuration }
        '400': { description: Invalid email or amount exceeds available balance }
        '404': { description: Invoice not found }
        '409': { description: Invoice is cancelled or already paid }
        '503': { description: Checkout is not configured }
  /api/public/invoices/{id}/verify-payment:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Public invoice and checkout]
      summary: Verify checkout return against provider
      description: A browser redirect is not proof of payment. The server verifies the transaction with PayChangu.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentVerificationInput' }
      responses:
        '200': { description: Returns current verified provider status }
        '400': { description: Missing payment reference }
        '404': { description: Payment reference not found for invoice }
  /api/public/invoices/{id}/qr:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Public invoice and checkout]
      summary: Generate QR code for public invoice page
      security: []
      responses:
        '200': { description: Invoice URL and QR data URL }
        '404': { description: Invoice not found }
  /api/public/payments/{id}/receipt:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Public invoice and checkout]
      summary: Get receipt after verified successful payment
      security: []
      responses:
        '200': { description: Receipt details }
        '404': { description: Payment not found }
        '409': { description: Receipt not ready; payment not verified as paid }
  /api/paychangu/webhook:
    post:
      tags: [Provider callbacks]
      summary: PayChangu signed webhook receiver
      description: Provider-only callback. Validates HMAC signature and then verifies transaction details. Do not call this as an organizational API.
      security: []
      responses:
        '200': { description: Event accepted }
        '401': { description: Invalid signature }
        '503': { description: Webhook secret not configured }
  /api/paychangu/return:
    get:
      tags: [Provider callbacks]
      summary: PayChangu return handler
      security: []
      responses:
        '200': { description: Return handler response }
